<!doctype html>
<html lang="en" data-layout="garden" data-mode="dark" data-accent="lettuce">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="lettuce.talk is a playful community chat app. Channels, voice, and a space you can shape however you want."
    />
    <meta name="theme-color" content="#0c0d0b" />
    <title>lettuce.talk — talk about anything</title>
    <link rel="icon" type="image/png" href="/assets/letty-icon.png" />
    <link rel="preload" href="/assets/fonts/satoshi-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var p = new URLSearchParams(location.search);
        var s = JSON.parse(localStorage.getItem("lettuce.look") || "{}");
        var mode = p.get("mode") || s.mode || "dark";
        var accent = p.get("accent") || s.accent || "lettuce";
        var layout = p.get("layout") || s.layout || "garden";
        document.documentElement.dataset.mode = mode;
        document.documentElement.dataset.accent = accent;
        document.documentElement.dataset.layout = layout;
        document.documentElement.style.colorScheme = mode;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
